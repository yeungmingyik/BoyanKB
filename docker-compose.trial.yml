services:
  app:
    image: boyankb/app:v0.8.2-trial-graph-v3@sha256:ac806ca72aa54f18c73b5a4140cb18c75aa0f3a41fe1a1cd2cb5b5f7da04d756
    pull_policy: never
    environment:
      DISABLE_REGISTRATION: "true"
      OIDC_AUTH_ENABLE: "false"
      WEKNORA_AUTH_COMPLEX_PASSWORD_ENABLED: "true"
      WEKNORA_AUTH_DEFAULT_TENANT_MODE: tenantless
      WEKNORA_TENANT_SELF_SERVICE_CREATION_ENABLED: "false"
      WEKNORA_TENANT_ENABLE_RBAC: "true"
      WEKNORA_TENANT_ENABLE_CROSS_TENANT_ACCESS: "false"
      WEKNORA_TENANT_AUTO_CREATE_API_KEY: "false"
      WEKNORA_TENANT_AUTO_ACCEPT_INVITATION: "false"
      WEKNORA_INVITATION_TTL: 24h
      WEKNORA_SANDBOX_DOCKER_ENABLED: "false"
      WEKNORA_AGENT_TOOL_APPROVAL_FAIL_OPEN: "false"
      WEKNORA_TRUSTED_PROXIES: 10.239.70.3/32
      FRONTEND_BASE_URL: https://kb.boyantech.xyz
      LOG_LEVEL: warn
      LOG_PATH: ""
      LLM_DEBUG_LOG: "false"
      WEKNORA_LLM_STREAM_RAW_DUMP: ""
      LANGFUSE_ENABLED: "false"
    networks:
      boyan-trial-web:
        ipv4_address: 10.239.70.4
    mem_limit: 1536m
    cpus: 2
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  frontend:
    image: boyankb/frontend:v0.8.2-trial-skills-v3@sha256:4951e0703bd3c948554293a2e6fa3448db7206228b8e9fc4f481bf78f300537b
    pull_policy: never
    entrypoint: ["/bin/sh", "/etc/boyankb/trial-entrypoint.sh"]
    environment:
      APP_HOST: 10.239.70.4
      APP_PORT: "8080"
      APP_SCHEME: http
    volumes:
      - ./deployment/trial/frontend-entrypoint.sh:/etc/boyankb/trial-entrypoint.sh:ro
    networks:
      boyan-trial-web:
        ipv4_address: 10.239.70.3
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

  docreader:
    image: wechatopenai/weknora-docreader:v0.8.2@sha256:3c36e7e738ba515315523876d8041f9bb02809145a4e3b331e2550e4bff98b7a
    pull_policy: never
    mem_limit: 1024m
    cpus: 1
    pids_limit: 256

  postgres:
    image: paradedb/paradedb:v0.22.6-pg17@sha256:58bf87d2a6f1e72f56590b0f0ae1467e82c3f99ca203dde646672c8ac13148b2
    pull_policy: never
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 256

  redis:
    image: redis:7.0-alpine@sha256:c9d92d840fd011c908f040592857c724ae6d877f2aba5c40ad963276507386b2
    pull_policy: never
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

  ollama:
    image: ollama/ollama:0.18.2@sha256:5a5d014aa774f78ebe1340c0d4afc2e35afc12a2c3b34c84e71f78ea20af4ba3
    pull_policy: never
    mem_limit: 2048m
    cpus: 2
    pids_limit: 256

  trial-gateway:
    image: boyankb/trial-gateway:2.11.7-v1@sha256:99aaa42a089894ceadd1f5094709845715a0e3088ea6b087a2ae7a452c2ac37c
    pull_policy: never
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./deployment/trial/Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m,mode=1777
      - /config:rw,nosuid,nodev,size=16m,mode=1777
      - /data:rw,nosuid,nodev,size=16m,mode=1777
    networks:
      boyan-trial-web:
        ipv4_address: 10.239.70.2
      boyan-trial-edge: {}
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 96
    healthcheck:
      test: ["CMD-SHELL", "wget -q --header='Host: kb.boyantech.xyz' -O /dev/null http://127.0.0.1:8090/login"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      frontend:
        condition: service_healthy

networks:
  boyan-trial-edge: {}
  boyan-trial-web:
    internal: true
    ipam:
      config:
        - subnet: 10.239.70.0/24
