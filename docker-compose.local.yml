name: weknora-local

services:
  frontend:
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-8088}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  app:
    image: weknora-local/app:feishu-v0.8.2
    build:
      context: .
      dockerfile: docker/Dockerfile.feishu-local
    ports: !override
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - ./config/builtin_models.local.yaml:/app/config/builtin_models.local.yaml:ro
    environment:
      BUILTIN_MODELS_CONFIG: /app/config/builtin_models.local.yaml
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LOG_FORMAT: "%d %level [%traceId] %msg"
      FEISHU_DOCX_PARSE_MODE: export
      SSRF_WHITELIST_EXTRA: "${SSRF_WHITELIST_EXTRA:-ollama,api.deepseek.com},open.feishu.cn"
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy

  redis:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - redis-data-local:/data

  ollama:
    image: ollama/ollama:0.18.2
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama-data-local:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - WeKnora-network
    restart: unless-stopped

volumes:
  redis-data-local:
  ollama-data-local:
