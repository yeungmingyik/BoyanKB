services:
  app:
    networks:
      - default
      - partner-edge
  tunnel:
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    restart: unless-stopped
    init: true
    read_only: true
    command: ['tunnel', '--no-autoupdate', '--metrics', '127.0.0.1:2000', 'run', '--token-file', '/run/secrets/tunnel-token']
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${BOYANKB_STATE_DIR:?}/access/tunnel-token
        target: /run/secrets/tunnel-token
        read_only: true
        bind:
          create_host_path: false
    networks:
      - partner-edge
    healthcheck:
      test: ['CMD', 'cloudflared', 'tunnel', '--metrics', '127.0.0.1:2000', 'ready']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 1
    stop_grace_period: 30s

networks:
  partner-edge:
