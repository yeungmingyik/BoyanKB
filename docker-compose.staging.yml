services:
  caddy:
    ports: !override
      - "127.0.0.1:8089:80"
      - "127.0.0.1:8443:443"
    environment:
      PUBLIC_HOST: localhost
      PUBLIC_ORIGIN: https://localhost:8443
    volumes:
      - ./deployment/production/Caddyfile.staging:/etc/caddy/Caddyfile:ro
  app:
    environment:
      APP_EXTERNAL_URL: https://localhost:8443
      FRONTEND_BASE_URL: https://localhost:8443
